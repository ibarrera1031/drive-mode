<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive Mode – Inspect Tech</title>
  <style>
    :root { --bg: #0b1220; --card: #141d30; --text: #f1f5f9; --muted: #94a3b8; --go: #16a34a; --stop: #dc2626; --accent: #38bdf8; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent; }
    main { max-width: 640px; margin: 0 auto; padding: 16px; min-height: 100vh; display: flex; flex-direction: column; gap: 16px; }
    h1 { font-size: 20px; margin: 4px 0 0; color: var(--muted); font-weight: 600; letter-spacing: .5px; }
    #status { font-size: 30px; font-weight: 700; text-align: center; min-height: 80px; display: flex; align-items: center; justify-content: center; }
    #detail { font-size: 15px; color: var(--muted); text-align: center; min-height: 20px; }
    .big { width: 100%; border: 0; border-radius: 24px; color: #fff; font-size: 40px; font-weight: 800; padding: 0;
      height: 34vh; min-height: 180px; }
    .big:active { filter: brightness(1.2); }
    #startBtn { background: var(--go); }
    #stopBtn { background: var(--stop); }
    .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .chip { background: var(--card); border-radius: 14px; padding: 12px; }
    .chip b { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
    .chip span { font-size: 17px; font-weight: 600; }
    details { background: var(--card); border-radius: 14px; padding: 10px 12px; }
    summary { color: var(--muted); font-size: 14px; }
    #log { font-size: 14px; line-height: 1.45; max-height: 40vh; overflow-y: auto; margin-top: 8px; }
    #log div { margin: 4px 0; }
    #log .Ivan b { color: var(--accent); }
    #log .App { color: var(--muted); font-style: italic; }
    .hidden { display: none !important; }
    .err { color: #fca5a5; }
  </style>
</head>
<body>
<main>
  <h1>🚗 DRIVE MODE</h1>
  <div id="status">Loading…</div>
  <div id="detail"></div>
  <button id="startBtn" class="big" type="button" disabled>START</button>
  <button id="stopBtn" class="big hidden" type="button">STOP</button>
  <div class="chips">
    <div class="chip"><b>Date</b><span id="dateChip">—</span></div>
    <div class="chip"><b>Project</b><span id="projChip">—</span></div>
  </div>
  <a id="openHosted" class="big hidden" target="_top"
    style="display:flex;align-items:center;justify-content:center;background:#2563eb;text-decoration:none;text-align:center">OPEN DRIVE MODE</a>
  <label class="chip"><b>Voice (used from the next START)</b>
    <select id="voice" style="width:100%;font-size:17px;font-weight:600;background:var(--card);color:var(--text);border:0;padding:4px 0">
      <option value="Kore">Kore – firm</option>
      <option value="Aoede">Aoede – breezy</option>
      <option value="Leda">Leda – youthful</option>
      <option value="Zephyr" selected>Zephyr – bright</option>
      <option value="Sulafat">Sulafat – warm</option>
      <option value="Gacrux">Gacrux – mature</option>
      <option value="Puck">Puck – upbeat</option>
      <option value="Charon">Charon – informative</option>
      <option value="Fenrir">Fenrir – excitable</option>
      <option value="Orus">Orus – firm</option>
      <option value="Achird">Achird – friendly</option>
      <option value="Schedar">Schedar – even</option>
    </select></label>
  <a id="draftLink" class="chip hidden" target="_blank" style="color:var(--accent);font-weight:600;text-align:center">Open the draft report</a>
  <details><summary>Notes for this report</summary><div id="answers" style="font-size:14px;line-height:1.45;margin-top:8px"></div></details>
  <details><summary>Transcript (saved to the Drive Mode Log tab)</summary><div id="log"></div></details>
</main>

<script>
const $ = id => document.getElementById(id);
let INIT = null, KEY = '';   // KEY: the private key from the Drive Mode link (k=…)
// Hosted outside Apps Script (the iPhone allows the microphone only there): the link carries #api=<web app>&k=<key>
// and the server calls go to the web app's doPost. Inside Apps Script: google.script.run.
const OUTSIDE = typeof google === 'undefined' || !google.script;
const HASH = new URLSearchParams(location.hash.replace(/^#/, ''));
const API = HASH.get('api') || '';
function call(fn, ...args) {
  if (!OUTSIDE) return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  if (!API) return Promise.reject(new Error('This link is missing the script address. Use the Drive Mode link from myAppLinks.'));
  // text/plain body, no custom headers: the browser sends it straight to Apps Script without a CORS check first
  return fetch(API, { method: 'POST', body: JSON.stringify({ fn, args }) })
    .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.error); return j.result; });
}
// Interview state (also what a reconnect tells Gemini if the session can't be resumed)
// mode: 'setup' (asks date and project) -> 'dictation' (only listens) -> 'writing' -> 'done' (draft written)
const STATE = { mode: 'setup', date: '', dateSpoken: '', project: null, report: null, notes: [], interviewId: '' };
let allowSpeech = false, heardSpeech = false, lastWriteFailed = false;   // past setup, Gemini is heard only when the app asks it to speak
let ws = null, running = false, setupDone = false, resumeHandle = '', reconnecting = false;
let ctx = null, micStream = null, micNode = null, nextPlay = 0, playing = [], wakeLock = null;
let userText = '', botText = '';
const SESSION = new Date().toISOString().replace(/[-:]/g, '').substring(0, 15);
const LOG_KEY = 'driveLogPending';

// ---------- screen ----------
function status(text, detail) { $('status').textContent = text; if (detail !== undefined) $('detail').textContent = detail; }
function chips() {
  $('dateChip').textContent = STATE.dateSpoken || '—';
  $('projChip').textContent = STATE.project ? `${STATE.project.number} – ${projName(STATE.project)}` : '—';
}

// ---------- transcript: on screen, kept in the phone until the Sheet has it ----------
function pending() { try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch (e) { return []; } }
function setPending(l) { try { localStorage.setItem(LOG_KEY, JSON.stringify(l)); } catch (e) {} }
function log(who, text) {
  text = String(text || '').trim();
  if (!text) return;
  const line = { s: SESSION, t: new Date().toISOString(), who, text };
  const d = document.createElement('div');
  d.className = who;
  d.innerHTML = `<b></b> `; d.firstChild.textContent = who + ':'; d.appendChild(document.createTextNode(text));
  $('log').appendChild(d); $('log').scrollTop = $('log').scrollHeight;
  setPending(pending().concat([line]));
}
let flushing = false;
function flushLog() {
  const lines = pending();
  if (flushing || !lines.length || !navigator.onLine) return;
  flushing = true;
  // Lines from an earlier session that never reached the Sheet go up under their own session id
  const bySession = {};
  lines.forEach(l => { (bySession[l.s] = bySession[l.s] || []).push(l); });
  const ids = Object.keys(bySession);
  let left = ids.length;
  const done = () => { if (--left === 0) flushing = false; };
  ids.forEach(id => call('driveSaveLog', KEY, id, bySession[id])
    .then(() => { const sent = bySession[id]; setPending(pending().filter(l => !sent.some(x => x.t === l.t && x.who === l.who && x.s === l.s))); done(); })
    .catch(done));
}
setInterval(flushLog, 15000);
window.addEventListener('online', flushLog);

// ---------- what Gemini is told ----------
function systemText() {
  return `You are the hands-free report assistant for Ivan, a California HCAI Inspector of Record (IOR), while he is driving.
He cannot look at or touch the phone. Speak English. Keep every reply to one short sentence.
After asking a question, stop and wait for him to answer. Never answer for him, and never call a tool based on a guess. Call set_report_date only after he has said a date, find_project only with words he actually said, and confirm_project only after he has said yes to that project.
Today is ${INIT.todaySpoken}.

Voice commands while you are asking the date and project:
- "stop": say a very short goodbye, then call end_interview.
- "repeat": repeat your last question.
- "go back": return to the previous question.

Step 1 - Date: ask "What date is this report for?" Turn answers like "today", "yesterday" or "last Tuesday" into a date and call set_report_date with it as YYYY-MM-DD. Say the date back with the weekday and ask him to confirm. If he says no, ask again.
Step 2 - Project: ask "Which project?" Call find_project with what he said (pass a project number as digits). If there is one clear match, ask "Is that <name>?" If there are several, read up to three names and ask which one. If none, look in his project list below yourself for the closest one (he may use a nickname, e.g. "WiFi phase 2" is "WiFi Ph 2"). If you still can't tell, ask him to say the name or the number again. When he confirms, call confirm_project with that project's number.

His active projects (number - name):
${INIT.projects.map(p => `${p.number} - ${p.calName && p.calName !== p.number ? p.calName + ' (' + p.name + ')' : p.name}`).join('\n')}

Step 3 - Listen: after confirm_project, say only "Go ahead." If it returned a problem, say that instead. From then on he dictates his report. Do not ask questions, read back, summarize, comment or call tools. The app records him and knows when he is finished. If you have to reply, say only "Okay."
Only speak again when a message starting "APP:" tells you to, and then say exactly what it tells you. If an APP message says he is starting another report, go back to Step 1.`;
}

const TOOLS = [{ functionDeclarations: [
  { name: 'set_report_date', description: 'Set the date of the daily report Ivan is reporting on.',
    parameters: { type: 'OBJECT', properties: { date: { type: 'STRING', description: 'YYYY-MM-DD' } }, required: ['date'] } },
  { name: 'find_project', description: 'Find Ivan\'s active projects that match what he said (name, nickname or project number).',
    parameters: { type: 'OBJECT', properties: { query: { type: 'STRING', description: 'What Ivan said, numbers as digits' } }, required: ['query'] } },
  { name: 'confirm_project', description: 'Set the project once Ivan has confirmed it.',
    parameters: { type: 'OBJECT', properties: { number: { type: 'STRING', description: 'Project number, e.g. S241643' } }, required: ['number'] } },
  { name: 'end_interview', description: 'End the session when Ivan says stop.', parameters: { type: 'OBJECT', properties: {} } }
] }];

// ---------- the tools (run on the phone) ----------
// Spoken words -> search words: "Wi-Fi phase two" -> wifi, ph, 2; "two forty one" -> 2, 41; "Phase II" -> ph, 2
const ONES = { zero: 0, oh: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11,
  twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19 };
const TENS = { twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90 };
const ROMAN = { ii: '2', iii: '3' };   // not iv: "Pharmacy IV" is intravenous
function searchWords(text) {
  const raw = String(text || '').toLowerCase().replace(/([a-z0-9])[-.'](?=[a-z0-9])/g, '$1').split(/[^a-z0-9]+/).filter(Boolean);
  const out = [];
  for (let i = 0; i < raw.length; i++) {
    const w = raw[i];
    if (w in TENS) { let v = TENS[w]; if (ONES[raw[i + 1]] > 0 && ONES[raw[i + 1]] < 10) v += ONES[raw[++i]]; out.push(String(v)); }
    else if (w in ONES) out.push(String(ONES[w]));
    else out.push(w === 'phase' ? 'ph' : ROMAN[w] || w);
  }
  return out;
}
// The longest run of digits said in a row ("s 2 4 1 0 4 6", "S-241046", "two forty one zero forty six")
function spokenDigits(words) {
  let best = '', run = '';
  words.forEach(w => {
    if (/^\d+$/.test(w)) { run += w; } else { (w.match(/\d+/g) || []).forEach(d => { if (d.length > best.length) best = d; }); run = ''; }
    if (run.length > best.length) best = run;
  });
  return best;
}
// The short name to say: the calendar name, unless that is just the number (no nickname set)
function projName(p) { return p.calName && p.calName !== p.number ? p.calName : p.name; }
const STOP = /^(the|project|job|for|and|at|of|on|in|to|hospital|huntington|building|bldg|s|number|is|it|its|um|uh)$/;
function findProjects(query) {
  const words = searchWords(query), digits = spokenDigits(words);
  const text = words.filter(w => !/^\d+$/.test(w) && w.length > 1 && !STOP.test(w));
  return INIT.projects.map(p => {
    const hayWords = searchWords(`${p.name} ${p.calName} ${p.location}`), hay = hayWords.join('');
    let score = 0;
    if (digits.length >= 3 && p.number.replace(/\D/g, '').indexOf(digits) !== -1) score += 10 + digits.length;
    text.forEach((w, i) => {
      if (hay.indexOf(w) !== -1 || (w.length > 4 && /s$/.test(w) && hay.indexOf(w.slice(0, -1)) !== -1)) score += w.length > 2 ? 2 : 1;   // elevators -> elevator
      if (i && hay.indexOf(text[i - 1] + w) !== -1) score += 3;   // "wi" "fi" -> wifi
    });
    // "phase 2": a small number counts only next to a name match, once
    if (score) words.filter((w, i, a) => /^\d{1,2}$/.test(w) && a.indexOf(w) === i).forEach(n => { if (hayWords.indexOf(n) !== -1) score += 1; });
    return { p, score };
  }).filter(x => x.score > 1).sort((a, b) => b.score - a.score).slice(0, 4)
    .map(x => ({ number: x.p.number, name: projName(x.p), fullName: x.p.name }));
}

// The day's draft: only to warn right away if it is already finalized. Then the app just listens.
async function loadReport(p) {
  const out = { ok: true, number: p.number, name: projName(p) };
  status('Loading the report…');
  try {
    const r = await call('driveReport', KEY, STATE.date || INIT.today, p.number);
    STATE.report = r;
    log('App', `Report ${r.date}: ${r.draft ? 'draft found (' + r.draft.status + ')' : 'no draft yet'}; last report ${r.previous ? r.previous.date : 'none'}.`);
    if (r.draft && /^(completed|generating)/i.test(r.draft.status)) {
      out.ok = false;
      out.problem = 'That report is already finalized. Tell him, and ask for another date or project.';
      status('Listening…');
      return out;
    }
  } catch (e) {
    log('App', 'Report not loaded: ' + (e.message || e));
    STATE.report = { date: STATE.date || INIT.today, project: p.number };   // the write checks again
  }
  STATE.mode = 'dictation'; allowSpeech = true; heardSpeech = false;
  status('Listening…', 'Say "end of report" when you are finished.');
  return out;
}

function showNotes() { $('answers').textContent = STATE.notes.join(' | '); }

// ---------- dictation: what he says is the record, so nothing depends on Gemini saving it ----------
const END_PHRASE = /\b(end of (the |this )?report|end report|that('?s| is) (all|it) for (the |this )?report)\b/i;
const NEXT_PHRASE = /\b(next|another|new) report\b/i;
const isStopWord = t => /^\W*stop\W*$/i.test(t);
function speak(text) {
  allowSpeech = true; heardSpeech = false;
  send({ clientContent: { turns: [{ role: 'user', parts: [{ text: 'APP: ' + text }] }], turnComplete: true } });
}
// The phrase can arrive in pieces and straddle two lines
function checkEndPhrase() {
  const last = STATE.notes.length ? STATE.notes[STATE.notes.length - 1] : '';
  const whole = userText.match(END_PHRASE);
  const m = whole || `${last} ${userText}`.match(END_PHRASE);
  if (!m) return false;
  log('Ivan', userText);
  if (!whole) STATE.notes.pop();
  const before = (whole ? userText : `${last} ${userText}`).substring(0, m.index).replace(/[\s,]+$/, '');
  userText = '';
  if (before) STATE.notes.push(before);
  showNotes();
  finishReport();
  return true;
}
const SPOKEN = { 'Site Activity:': 'site activity', 'HCAI Officials / Field Visits:': 'HCAI visit', 'Caltech Labs:': 'deputy inspections',
  'Field Inspection:': 'field inspections', 'Meetings / Emails / Phone Calls / Communications:': 'communications', 'Deficiencies Noted:': 'deficiencies' };
async function finishReport() {
  STATE.mode = 'writing';
  if (!STATE.notes.length) {
    STATE.mode = 'done'; lastWriteFailed = false;
    speak('Say exactly: "I didn\'t hear any notes, so nothing was written. Say next report, or stop."');
    return;
  }
  status('Writing the draft…', '');
  log('App', 'End of report.');
  flushLog();
  const r = await writeDraft();
  STATE.mode = 'done'; lastWriteFailed = !r.ok;
  status(r.ok ? 'Draft updated' : 'Draft not updated', r.ok ? 'Review and approve it when you are parked.' : String(r.error || ''));
  if (!r.ok) { speak(`Say exactly: "The draft was not updated, but your notes are saved in the log. Say try again, or stop."`); return; }
  const names = (r.sections || []).map(h => SPOKEN[h] || h.replace(/:$/, '')).join(', ');
  speak(`Say exactly: "Draft updated with ${names || 'your corrections'}.${r.siteFrom ? ' Site activity copied from ' + r.siteFrom + '.' : ''}` +
    `${(r.warnings || []).join(' ') ? ' ' + r.warnings.join(' ') : ''}${r.aiFailed ? ' The formatting failed, so your own words are in the draft, flagged for clean-up.' : ''} Say next report, or stop."`);
}
function nextReport() {
  Object.assign(STATE, { mode: 'setup', date: '', dateSpoken: '', project: null, report: null, notes: [], interviewId: new Date().toISOString() });
  chips(); showNotes(); $('draftLink').classList.add('hidden');
  status('Listening…', '');
  log('App', 'Next report.');
  speak('He is starting another report. Go back to Step 1 and ask the date.');
}

// The draft: one write at a time
async function writeDraft() {
  try {
    const r = await call('driveWriteDraft', KEY, STATE.report.date, STATE.project.number, { notes: STATE.notes }, STATE.interviewId);
    if (!r.ok) { log('App', 'Draft not updated: ' + r.error); return r; }
    log('App', `Draft updated: ${r.added} line(s) added, ${r.removed} replaced, ${r.corrected} corrected.${r.aiFailed ? ' Raw notes: formatting failed.' : ''} ${r.url}`);
    $('draftLink').href = r.url; $('draftLink').classList.remove('hidden');
    return r;
  } catch (e) {
    log('App', 'Draft not updated: ' + (e.message || e));
    return { ok: false, error: String(e.message || e) };
  }
}

function runTool(name, args) {
  args = args || {};
  if (STATE.mode !== 'setup') return { ok: true, note: 'Stay silent. The app is recording him.' };
  if (name === 'set_report_date') {
    const m = String(args.date || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    const d = m && new Date(+m[1], +m[2] - 1, +m[3], 12);
    if (!d || isNaN(d)) return { ok: false, error: 'Not a valid date. Ask again.' };
    STATE.date = args.date;
    STATE.dateSpoken = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    chips(); log('App', `Date set: ${STATE.dateSpoken}`);
    return { ok: true, date: STATE.date, say: STATE.dateSpoken };
  }
  if (name === 'find_project') {
    const matches = findProjects(args.query);
    log('App', `Project search "${args.query}": ${matches.map(m => m.number + ' ' + m.name).join('; ') || 'no match'}`);
    return matches.length ? { matches } : { matches: [], hint: 'No project matched. Ask him to say the project name or number again.' };
  }
  if (name === 'confirm_project') {
    const n = String(args.number || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    const p = INIT.projects.find(x => x.number.toUpperCase() === n);
    if (!p) return { ok: false, error: 'That number is not one of the active projects. Search again.' };
    STATE.project = p; chips(); log('App', `Project set: ${p.number} ${projName(p)}`);
    return loadReport(p);
  }
  if (name === 'end_interview') {
    // let the goodbye finish playing first
    setTimeout(() => stop('Stopped by voice.'), Math.max(0, (nextPlay - (ctx ? ctx.currentTime : 0)) * 1000) + 600);
    return { ok: true };
  }
  return { ok: false, error: 'Unknown tool' };
}

// ---------- audio ----------
function toBase64(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
// Microphone samples (phone rate, e.g. 48 kHz) -> 16 kHz 16-bit PCM, which is what Gemini Live expects
function to16k(input, rate) {
  const ratio = rate / 16000, n = Math.floor(input.length / ratio), out = new Int16Array(n);
  for (let i = 0; i < n; i++) {
    const a = Math.floor(i * ratio), b = Math.min(input.length, Math.floor((i + 1) * ratio));
    let sum = 0; for (let j = a; j < b; j++) sum += input[j];
    const v = Math.max(-1, Math.min(1, sum / Math.max(1, b - a)));
    out[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
  }
  return out;
}
async function startMic() {
  micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  const src = ctx.createMediaStreamSource(micStream);
  micNode = ctx.createScriptProcessor(4096, 1, 1);
  micNode.onaudioprocess = e => {
    if (!ws || ws.readyState !== 1 || !setupDone) return;
    const pcm = to16k(e.inputBuffer.getChannelData(0), ctx.sampleRate);
    send({ realtimeInput: { audio: { data: toBase64(new Uint8Array(pcm.buffer)), mimeType: 'audio/pcm;rate=16000' } } });
  };
  src.connect(micNode); micNode.connect(ctx.destination);   // the node outputs silence; it only needs to be connected to run
}
// Gemini's voice comes back as 24 kHz 16-bit PCM chunks, played one after the other
function playChunk(b64) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const pcm = new Int16Array(bytes.buffer, 0, bytes.length >> 1);
  if (!pcm.length) return;
  const buf = ctx.createBuffer(1, pcm.length, 24000), ch = buf.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 0x8000;
  const s = ctx.createBufferSource(); s.buffer = buf; s.connect(ctx.destination);
  const at = Math.max(ctx.currentTime + 0.05, nextPlay);
  s.start(at); nextPlay = at + buf.duration;
  playing.push(s); s.onended = () => { playing = playing.filter(x => x !== s); if (!playing.length && running) status('Listening…'); };
  status('Speaking…');
}
function stopPlayback() { playing.forEach(s => { try { s.stop(); } catch (e) {} }); playing = []; nextPlay = 0; }

// ---------- Gemini Live connection ----------
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
function getToken() { return call('driveLiveToken', KEY); }
const sleep = ms => new Promise(r => setTimeout(r, ms));
let everConnected = false, failures = 0, sessionVoice = '';
// The voice he picked stays on this phone
try { const v = localStorage.getItem('driveVoice'); if (v) $('voice').value = v; } catch (e) {}
if (!$('voice').value) $('voice').value = 'Zephyr';   // a saved voice no longer on the list
$('voice').onchange = () => { try { localStorage.setItem('driveVoice', $('voice').value); } catch (e) {} };
async function connect() {
  const token = await getToken();
  setupDone = false;
  const resuming = !!resumeHandle;
  const sock = new WebSocket('wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained?access_token=' + encodeURIComponent(token));
  ws = sock;
  sock.binaryType = 'arraybuffer';
  sock.onopen = () => send({ setup: {
    model: INIT.model,
    generationConfig: { responseModalities: ['AUDIO'], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: sessionVoice } } } },
    systemInstruction: { parts: [{ text: systemText() }] },
    tools: TOOLS,
    inputAudioTranscription: {}, outputAudioTranscription: {},
    sessionResumption: resuming ? { handle: resumeHandle } : {},
    contextWindowCompression: { slidingWindow: {} }
  } });
  sock.onmessage = ev => { if (sock === ws) onMessage(JSON.parse(typeof ev.data === 'string' ? ev.data : new TextDecoder().decode(ev.data)), resuming); };
  sock.onclose = ev => {
    if (sock !== ws) return;   // an old connection we already replaced
    ws = null;
    if (!running) return;
    const why = `${ev.code}${ev.reason ? ': ' + ev.reason : ''}`;
    log('App', `Connection closed (${why}).`);
    // Never connected at all (bad model name, key, billing): stop and show Gemini's reason
    if (!everConnected) return stop(`Could not start the voice session (${why}).`, true);
    if (!setupDone && resuming) resumeHandle = '';   // the old session can't be resumed: start a new one with what we have
    failures++;
    reconnect();
  };
}
async function reconnect() {
  if (reconnecting || !running) return;
  reconnecting = true;
  status('Reconnecting…', 'Signal dropped or the session timed out. Keep driving.');
  const old = ws; ws = null;
  if (old) { try { old.close(); } catch (e) {} }
  flushTurn();
  if (failures > 1) await sleep(3000);
  while (running && failures < 40) {
    try { await connect(); break; }
    catch (e) { failures++; await sleep(3000); }   // offline: the token request fails until the signal is back
  }
  reconnecting = false;
  if (running && failures >= 40) stop('Could not reconnect. The transcript so far is saved on this phone.', true);
}
function onMessage(m, resuming) {
  if (m.setupComplete) {
    setupDone = true; everConnected = true; failures = 0;
    status('Listening…', '');
    if (resuming) { log('App', 'Reconnected.'); return; }
    // A new session (first start, or the old one couldn't be resumed): tell Gemini what is already set
    if (STATE.mode !== 'setup') {
      send({ clientContent: { turns: [{ role: 'user', parts: [{ text: 'APP: We were cut off, but the date and project are set and the app is still recording him. Stay silent.' }] }], turnComplete: true } });
      return;
    }
    const known = [STATE.date ? `the date is set to ${STATE.dateSpoken} (${STATE.date})` : '',
      STATE.project ? `the project is set to ${STATE.project.number} ${projName(STATE.project)}` : ''].filter(Boolean);
    const text = known.length ? `We were cut off. Already done: ${known.join(' and ')}. Briefly say you're back and continue from the next step.` : 'Start.';
    send({ clientContent: { turns: [{ role: 'user', parts: [{ text }] }], turnComplete: true } });
    return;
  }
  if (m.sessionResumptionUpdate) { if (m.sessionResumptionUpdate.resumable && m.sessionResumptionUpdate.newHandle) resumeHandle = m.sessionResumptionUpdate.newHandle; return; }
  if (m.goAway) { reconnect(); return; }
  if (m.toolCall) {
    flushTurn();
    // A tool may wait on the server (the report); reply when all of this call's tools are done
    Promise.all((m.toolCall.functionCalls || []).map(async fc => ({ id: fc.id, name: fc.name,
      response: await Promise.resolve(runTool(fc.name, fc.args)).catch(e => ({ ok: false, error: String(e && e.message || e) })) })))
      .then(functionResponses => send({ toolResponse: { functionResponses } }));
    return;
  }
  const sc = m.serverContent;
  if (!sc) return;
  if (sc.inputTranscription && sc.inputTranscription.text) {
    userText += sc.inputTranscription.text;
    if (STATE.mode === 'dictation') checkEndPhrase();
    else if (STATE.mode === 'done' && NEXT_PHRASE.test(userText)) { log('Ivan', userText); userText = ''; nextReport(); }
    else if (STATE.mode === 'done' && lastWriteFailed && /\btry again\b/i.test(userText)) { log('Ivan', userText); userText = ''; finishReport(); }
  }
  // Past setup Gemini stays muted unless the app asked it to speak (it can't help answering each pause)
  const audible = STATE.mode === 'setup' || allowSpeech;
  if (audible && sc.outputTranscription && sc.outputTranscription.text) { if (userText) flushUser(); botText += sc.outputTranscription.text; }
  if (audible) ((sc.modelTurn && sc.modelTurn.parts) || []).forEach(p => { if (p.inlineData && /audio/.test(p.inlineData.mimeType || 'audio')) { heardSpeech = true; playChunk(p.inlineData.data); } });
  if (sc.interrupted) { if (audible) stopPlayback(); heardSpeech = false; if (audible) flushTurn(); }
  if (sc.turnComplete) {
    flushTurn();
    if (heardSpeech && STATE.mode !== 'setup') allowSpeech = false;
  }
}
function flushUser() {
  const said = userText; userText = '';
  log('Ivan', said);
  if (isStopWord(said) && STATE.mode !== 'setup') { stop('Stopped by voice.'); return; }
  if (STATE.mode === 'dictation') { STATE.notes.push(said.trim()); showNotes(); }
}
function flushTurn() { if (userText) flushUser(); if (botText) { log('Assistant', botText); botText = ''; } }

// ---------- start / stop ----------
async function start() {
  $('startBtn').classList.add('hidden'); $('stopBtn').classList.remove('hidden');
  status('Starting…', 'Allow the microphone if the phone asks.');
  try {
    running = true; resumeHandle = ''; everConnected = false; failures = 0;
    sessionVoice = $('voice').value;
    // A new START is a new interview (a dropped signal reconnects without coming through here)
    Object.assign(STATE, { mode: 'setup', date: '', dateSpoken: '', project: null, report: null, notes: [], interviewId: new Date().toISOString() });
    allowSpeech = false;
    $('draftLink').classList.add('hidden');
    chips(); showNotes();
    // Create and wake the audio right at the tap, before anything waits (iPhones only allow it there)
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.resume().catch(() => {});
    await startMic();
    // Keep the screen on (not waited for: it can hang on a permission prompt)
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { wakeLock = l; }).catch(() => {}); } catch (e) {}
    log('App', 'Drive Mode started.');
    await connect();
  } catch (e) {
    const blocked = e && e.name === 'NotAllowedError';
    stop(!blocked ? 'Could not start: ' + (e && e.message || e)
      : OUTSIDE ? 'The microphone is blocked. iPhone: Settings → Apps → Safari (or Chrome) → Microphone → Allow, then reload this page.'
      : 'iPhones block the microphone inside Apps Script pages. Open the Drive Mode link from myAppLinks instead.', true);
  }
}
function stop(why, isError) {
  running = false; setupDone = false;
  flushTurn();
  // Dictation not ended with "end of report" stays out of the draft; the Drive Mode Log tab has every word
  if (STATE.mode === 'dictation' && STATE.notes.length) why = (why || 'Stopped.') + ' These notes were not written to the draft; they are in the Drive Mode Log tab.';
  STATE.mode = 'setup';
  const old = ws; ws = null;
  if (old) { try { if (old.readyState === 1) old.send(JSON.stringify({ realtimeInput: { audioStreamEnd: true } })); old.close(); } catch (e) {} }
  stopPlayback();
  if (micNode) { try { micNode.disconnect(); } catch (e) {} micNode = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (ctx) { try { ctx.close(); } catch (e) {} ctx = null; }
  if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  log('App', why || 'Stopped.');
  flushLog();
  status(isError ? 'Stopped' : 'Done', why || '');
  $('detail').className = isError ? 'err' : '';
  $('stopBtn').classList.add('hidden'); $('startBtn').classList.remove('hidden');
}
$('startBtn').onclick = start;
$('stopBtn').onclick = () => stop('Stopped.');

function load() {
  call('driveInit', KEY).then(init => {
    INIT = init;
    // Inside Apps Script the iPhone blocks the microphone: send Ivan to the hosted page instead
    if (!OUTSIDE && init.hostedLink && /iPhone|iPad|iPod/.test(navigator.userAgent)) {
      status('Open Drive Mode', 'This Google page can\'t use the iPhone microphone. Tap below to open Drive Mode.');
      $('startBtn').classList.add('hidden');
      $('openHosted').href = init.hostedLink; $('openHosted').classList.remove('hidden');
      return;
    }
    status('Ready', `${init.projects.length} active projects loaded. Tap START, then just talk.`);
    $('startBtn').disabled = false;
    flushLog();   // transcript lines from a session that ended offline
  }).catch(e => { status('Could not load', e.message); $('detail').className = 'err'; });
}
if (OUTSIDE) { KEY = HASH.get('k') || ''; load(); }
else google.script.url.getLocation(loc => { KEY = (loc.parameter && loc.parameter.k) || ''; load(); });
</script>
